<!DOCTYPE html>
<html lang="no">
<head>

<title>Dørflukt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23120a14'/%3E%3Crect x='11' y='6' width='18' height='30' fill='%23f2c14e'/%3E%3Crect x='13' y='8' width='14' height='28' fill='%237a4f26'/%3E%3Ccircle cx='24' cy='22' r='1.6' fill='%23f2c14e'/%3E%3C/svg%3E">
<style>
:root{--acc:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#2a1a2e,#0a070c 70%);color:#f3ead8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;justify-content:center}
.screen{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.menu{align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;overflow:auto}
.logo svg{width:110px;height:140px;filter:drop-shadow(0 0 24px rgba(242,193,78,.45))}
h1{font-size:42px;letter-spacing:6px;margin:0;font-weight:900;text-shadow:0 0 18px rgba(255,60,60,.55),0 3px 0 #000}
h2{margin:0 0 6px;font-size:24px}
.sub{opacity:.85;margin:0;max-width:340px}
.big{background:linear-gradient(#f6cf65,#d99a1e);color:#2a1606;font-weight:900;font-size:24px;padding:16px 56px;border-radius:16px;box-shadow:0 6px 0 #8a5a10,0 10px 30px rgba(0,0,0,.5)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #8a5a10}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{background:#2a2030;padding:10px 16px;border-radius:12px;border:2px solid #3d3145;font-weight:600}
.chip.on{border-color:var(--acc);background:#3a2c1a}
.small{font-size:12px;opacity:.6;margin:0}
.link{font-size:12px;opacity:.5;text-decoration:underline}
.heroes{display:flex;gap:14px}
.hero{background:#21182a;border:3px solid #3d3145;border-radius:18px;padding:14px;width:150px}
.hero.on{border-color:var(--acc);box-shadow:0 0 18px rgba(242,193,78,.4)}
.hero svg{width:110px;height:110px}
.hero b{display:block;font-size:20px;margin-top:6px}
.wtop{display:flex;align-items:center;gap:10px;width:100%}
.wtop h2{flex:1;margin:0}
.back{width:44px;height:44px;border-radius:12px;background:#2a2030;font-size:22px}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.wc{background:#1d1524;border:2px solid #3d3145;border-radius:16px;padding:8px;text-align:center;position:relative}
.wc .prev{width:100%;height:120px;border-radius:10px;background:#000;display:block;cursor:pointer}
.wc h3{margin:6px 0 6px;font-size:16px}
.dots{display:flex;gap:4px;justify-content:center}
.dots button{width:27px;height:32px;border-radius:6px 6px 2px 2px;background:#3a2c3f;font-size:12px;font-weight:800;color:#bbb}
.dots button.done{background:#2ecc71;color:#063}
.dots button.next{background:var(--acc);color:#2a1606}
.dots button:disabled{opacity:.3;cursor:default}
.wc .lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;background:rgba(0,0,0,.72);border-radius:14px;padding:10px;gap:6px}
.wc .lk b{font-size:30px}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(0,0,0,.4)}
.top button{width:42px;height:42px;border-radius:12px;background:#2a2030;font-size:20px;flex:none}
.ttl{flex:1;text-align:center;font-weight:800;font-size:16px}
.ttl small{display:block;font-weight:500;opacity:.7;font-size:12px}
.stage{flex:1;min-height:0;position:relative}
#scene{width:100%;height:100%;display:block;touch-action:none}
.msg{min-height:60px;display:flex;align-items:center;gap:10px;padding:6px 12px;background:rgba(0,0,0,.5);font-size:15px;line-height:1.25}
.msg .av svg{width:42px;height:42px;display:block}
.msg.pop .tx{animation:pop .35s}
.inv{display:flex;gap:6px;justify-content:center;padding:8px 8px 10px;background:linear-gradient(#2a1f18,#17110c);border-top:3px solid #5a4030}
.slot{width:52px;height:52px;border-radius:10px;background:#0f0a07;border:2px solid #4a3527;padding:4px}
.slot svg{width:100%;height:100%;display:block}
.slot.sel{border-color:#f2c14e;box-shadow:0 0 14px #f2c14e;background:#3a2a10}
#chase{position:absolute;left:12px;right:12px;top:8px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#ff8a8a;pointer-events:none;text-shadow:0 1px 2px #000}
#chase .bar{flex:1;height:10px;background:rgba(0,0,0,.7);border-radius:6px;overflow:hidden;border:1px solid #a33}
#chase i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f39c12,#e74c3c);transition:width .25s linear}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:20}
.ov[hidden]{display:none}
.pad{background:#1e2326;border:3px solid #556;border-radius:18px;padding:16px;width:270px}
.disp{background:#0b1a0b;color:#3f3;font:700 34px/1 ui-monospace,Consolas,monospace;letter-spacing:10px;text-align:center;padding:12px;border-radius:8px;margin-bottom:12px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:56px;border-radius:10px;background:#3b4248;font-size:24px;font-weight:700;box-shadow:0 3px 0 #1a1d20}
.keys button:active{transform:translateY(2px)}
.pad .x{width:100%;margin-top:10px;padding:10px;border-radius:10px;background:#55303a;font-weight:700}
.bad{animation:shake .4s}
#scare{position:fixed;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center;overflow:hidden}
#scare.on{display:flex;animation:scareIn 1s ease-out forwards}
#scare svg{width:min(125vw,125vh);height:min(125vw,125vh);animation:zoom 1s ease-out forwards}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s;z-index:90}
#fade.on{opacity:1}
.hs{cursor:pointer}
.spk{animation:spk 1.1s ease-in-out infinite}
.shk{animation:shk .35s;transform-box:fill-box;transform-origin:50% 100%}
.pl.opening{animation:dl 1.3s ease-in-out forwards}.pr.opening{animation:dr 1.3s ease-in-out forwards}
.pl.opened{transform:translateX(-52px)}.pr.opened{transform:translateX(52px)}
.glow{animation:glow 1.6s ease-in-out infinite}
.peek{animation:peek 2.2s ease-in-out forwards}
.pulse{animation:pulse 3s ease-in-out infinite}
.shakeScreen{animation:shake .45s}
@keyframes dl{to{transform:translateX(-52px)}}@keyframes dr{to{transform:translateX(52px)}}
@keyframes spk{0%,100%{opacity:.12}50%{opacity:.55}}
@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes peek{0%{opacity:0}20%,80%{opacity:1}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.13}}
@keyframes pop{0%{transform:scale(.92);opacity:.3}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes zoom{0%{transform:scale(.25) rotate(-8deg)}14%{transform:scale(1.08) rotate(3deg)}24%{transform:scale(1) rotate(-2deg)}100%{transform:scale(1.18)}}
@keyframes scareIn{0%{background:#fff}10%{background:#400}100%{background:#000}}
.win{align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;overflow:hidden}
.win .hb svg{width:160px;height:160px;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-12px)}}
.conf{position:absolute;top:-20px;width:9px;height:14px;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ================= GRUNNLAG ================= */
const $=s=>document.querySelector(s);
const L=(no,en)=>({no,en});
let S={lang:'no',hero:'felicia',sound:true,scary:true,prog:[0,0,0,0]};
function load(){try{const d=JSON.parse(localStorage.getItem('dorflukt'));if(d)Object.assign(S,d)}catch(e){}if(!Array.isArray(S.prog)||S.prog.length!==4)S.prog=[0,0,0,0]}
function save(){try{localStorage.setItem('dorflukt',JSON.stringify(S))}catch(e){}}
const UI={
no:{title:'DØRFLUKT',sub:'Hjelp vennen din ut gjennom 20 skumle dører',play:'SPILL',choose:'Hvem skal du hjelpe ut?',worlds:'Velg bane',hint:'Hint',locked:'Døren er låst.',nothing:'Ingenting skjer.',noUse:'Det fungerer ikke her.',door:'Dør',enter:'Døren er åpen! Trykk på døren for å gå videre.',scary:'Skrekk',sound:'Lyd',on:'på',off:'av',reset:'Nullstill fremgang',win:'DU KLARTE DET!',escaped:'kom seg ut av',next:'Neste bane',menu:'Til banene',allDone:'Alle 20 dørene er åpnet! Du er en ekte dørmester!',lockedWorld:'Klar de tre andre banene først',chase:'Monsteret kommer!',caught:'Monsteret tok deg! Prøv igjen – raskere denne gangen.',close:'Lukk',offline:'Virker uten nett · Fremgangen lagres automatisk',resetQ:'Vil du slette all fremgang?',wrongCode:'Feil kode.',selected:'Valgt',tapUse:'Trykk der du vil bruke den.',found:'Du fant'},
en:{title:'DOOR ESCAPE',sub:'Help your friend escape through 20 creepy doors',play:'PLAY',choose:'Who will you help escape?',worlds:'Choose a world',hint:'Hint',locked:'The door is locked.',nothing:'Nothing happens.',noUse:"That doesn't work here.",door:'Door',enter:'The door is open! Tap the door to go on.',scary:'Scares',sound:'Sound',on:'on',off:'off',reset:'Reset progress',win:'YOU DID IT!',escaped:'escaped from',next:'Next world',menu:'To the worlds',allDone:'All 20 doors are open! You are a true door master!',lockedWorld:'Finish the other three worlds first',chase:'The monster is coming!',caught:'The monster got you! Try again – faster this time.',close:'Close',offline:'Works offline · Progress saves automatically',resetQ:'Delete all progress?',wrongCode:'Wrong code.',selected:'Selected',tapUse:'Tap where you want to use it.',found:'You found'}};
const tx=o=>o==null?'':typeof o==='string'?(UI[S.lang][o]??o):(o[S.lang]??o.no);

/* ================= LYD (Web Audio) ================= */
let AC=null,master=null,amb=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination)}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',v=.2,f2=null,delay=0){if(!S.sound)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function noise(d=.3,v=.3,fq=1000,ft='lowpass',delay=0){if(!S.sound)return;const a=ac();if(!a)return;const t=a.currentTime+delay;const len=Math.max(1,Math.floor(a.sampleRate*d));const b=a.createBuffer(1,len,a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=ft;f.frequency.value=fq;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
const SFX={
 click:()=>tone(520,.05,'square',.04),
 pick:()=>{tone(660,.1,'triangle',.2);tone(880,.1,'triangle',.2,null,.08);tone(1320,.2,'triangle',.2,null,.16)},
 locked:()=>{noise(.07,.5,400);noise(.07,.5,400,'lowpass',.12);tone(110,.15,'square',.06)},
 wrong:()=>tone(160,.35,'sawtooth',.14,90),
 good:()=>{tone(880,.12,'sine',.2);tone(1320,.22,'sine',.2,null,.1)},
 beep:()=>tone(1200,.05,'square',.05),
 unlock:()=>{noise(.05,.5,3000,'highpass');tone(1500,.08,'square',.06,null,.06);tone(2000,.1,'triangle',.1,null,.12)},
 door:()=>{tone(85,1.3,'sawtooth',.06,140);tone(130,1.2,'sawtooth',.035,70,.1);noise(1.2,.1,500)},
 smash:()=>{noise(.45,.7,1800);tone(80,.3,'square',.18,40)},
 whoosh:()=>noise(.35,.25,900,'bandpass'),
 thud:()=>{tone(90,.12,'sine',.4,50);noise(.06,.2,200)},
 power:()=>{tone(60,.7,'sawtooth',.12,130);noise(.3,.3,200);tone(880,.2,'square',.05,null,.6)},
 step:()=>{noise(.08,.35,300);noise(.08,.35,300,'lowpass',.25)},
 heart:()=>{tone(58,.13,'sine',.55);tone(52,.13,'sine',.45,null,.17)},
 whisper:()=>noise(.7,.06,2500,'bandpass'),
 mbox:()=>[659,622,587,554,523,494,523,415].forEach((f,i)=>tone(f,.45,'triangle',.12,null,i*.2)),
 scare:()=>{noise(.9,.9,2500,'bandpass');tone(880,.9,'sawtooth',.32,170);tone(933,.9,'square',.22,150);tone(60,1,'sawtooth',.4,30)},
 win:()=>[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.3,'triangle',.22,null,i*.14))
};
const NOTE=[392,523,659,784];
function startAmb(w){stopAmb();if(!S.sound)return;const a=ac();if(!a)return;const v=w.ambV||.03;const g=a.createGain();g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(v,a.currentTime+2);g.connect(master);const os=w.amb.map((f,i)=>{const o=a.createOscillator();o.type=i?'triangle':'sine';o.frequency.value=f;o.connect(g);o.start();return o});const l=a.createOscillator(),lg=a.createGain();l.frequency.value=.15;lg.gain.value=v*.6;l.connect(lg);lg.connect(g.gain);l.start();amb={g,os:[...os,l]}}
function stopAmb(){if(!amb)return;try{amb.os.forEach(o=>o.stop())}catch(e){}try{amb.g.disconnect()}catch(e){}amb=null}

/* ================= TEGNEHJELPERE ================= */
const R=(x,y,w,h,f,e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${e}/>`;
const C=(x,y,r,f,e='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${e}/>`;
const E=(x,y,rx,ry,f,e='')=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${e}/>`;
const P=(d,f,e='')=>`<path d="${d}" fill="${f}" ${e}/>`;
const T=(x,y,s,sz,f,e='')=>`<text x="${x}" y="${y}" font-size="${sz}" fill="${f}" text-anchor="middle" font-family="system-ui,Arial,sans-serif" ${e}>${s}</text>`;
const Ln=(x1,y1,x2,y2,s,w=2,e='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}" ${e}/>`;
const hs=(id,inner)=>`<g data-h="${id}" class="hs">${inner}</g>`;
const HIT=(x,y,w,h)=>R(x,y,w,h,'#000','opacity=".01"');
const itemAt=(id,x,y,s=.8)=>`<g transform="translate(${x-20*s} ${y-20*s}) scale(${s})">${ICON[id]}</g>`;
const pick=(id,hid,x,y)=>hs(hid,C(x,y,19,'#fff','class="spk"')+itemAt(id,x,y,.9));
const rot=(on,a,x,y)=>on?`transform="rotate(${a} ${x} ${y})"`:'';
function star(x,y,r1,r2){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r2:r1;d+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1)}return d+'Z'}
function keyIcon(a,b){return `<circle cx="12" cy="20" r="7" fill="none" stroke="${a}" stroke-width="4.5"/><rect x="18" y="18" width="18" height="4.5" fill="${a}"/><rect x="28" y="22" width="3.5" height="7" fill="${a}"/><rect x="33" y="22" width="3" height="5" fill="${a}"/><circle cx="12" cy="20" r="9.3" fill="none" stroke="${b}" stroke-width="1" opacity=".7"/>`}

/* ================= GJENSTANDER ================= */
const ICON={
 key:keyIcon('#f2c14e','#9a6d10'),
 rkey:keyIcon('#b5651d','#5e2d0c'),
 skey:`<g transform="translate(6 6) scale(.7)">${keyIcon('#dfe6e9','#7f8c8d')}</g>`,
 hammer:`<g transform="rotate(-35 20 20)"><rect x="17.5" y="12" width="5" height="26" rx="2" fill="#8b5a2b"/><rect x="8" y="5" width="24" height="10" rx="2" fill="#7f8c8d"/><rect x="8" y="5" width="24" height="3" fill="#aab7b8"/></g>`,
 crowbar:`<path d="M8 35 L29 11 Q33 6 37 10" stroke="#c0392b" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M6 33 L10 37" stroke="#7b241c" stroke-width="3" stroke-linecap="round"/>`,
 handle:`<rect x="5" y="12" width="11" height="18" rx="3" fill="#9a7010"/><rect x="11" y="16" width="25" height="7" rx="3.5" fill="#d4a017"/>`,
 card:`<rect x="5" y="10" width="30" height="20" rx="3" fill="#2e86de"/><rect x="5" y="14" width="30" height="4" fill="#1b4f8a"/><rect x="9" y="22" width="10" height="5" rx="1" fill="#f5d76e"/>`,
 fuse:`<rect x="10" y="13" width="20" height="14" rx="2" fill="#eee" stroke="#999"/><rect x="4" y="17" width="6" height="6" fill="#b8b8b8"/><rect x="30" y="17" width="6" height="6" fill="#b8b8b8"/><rect x="16" y="16" width="8" height="8" fill="#e74c3c"/>`,
 battery:`<rect x="7" y="11" width="23" height="18" rx="2" fill="#2d3436"/><rect x="7" y="11" width="9" height="18" rx="2" fill="#e1b12c"/><rect x="30" y="16" width="4" height="8" fill="#999"/><text x="22" y="24" font-size="9" fill="#fff" text-anchor="middle">+</text>`,
 bulb:`<circle cx="20" cy="16" r="10" fill="#fff59d" stroke="#d4ac0d"/><rect x="15" y="25" width="10" height="9" rx="1" fill="#aaa"/><path d="M15 28 h10 M15 31 h10" stroke="#777"/>`
};
const ITEMS={key:L('gullnøkkel','golden key'),rkey:L('rusten nøkkel','rusty key'),skey:L('liten nøkkel','small key'),hammer:L('hammer','hammer'),crowbar:L('brekkjern','crowbar'),handle:L('dørhåndtak','door handle'),card:L('nøkkelkort','key card'),fuse:L('sikring','fuse'),battery:L('batteri','battery'),bulb:L('lyspære','light bulb')};
const COL=[{c:'#e74c3c'},{c:'#3498db'},{c:'#2ecc71'},{c:'#f1c40f'}];

/* ================= HELTER ================= */
const HEROES={felicia:{name:'Felicia'},oscar:{name:'Oscar'}};
const heroName=()=>HEROES[S.hero].name;
function heroSVG(h){
 const face=`<circle cx="50" cy="50" r="20" fill="#f5c9a5"/><circle cx="43" cy="51" r="2.7" fill="#2d2d2d"/><circle cx="57" cy="51" r="2.7" fill="#2d2d2d"/><circle cx="38" cy="57" r="3" fill="#f5a0a0" opacity=".6"/><circle cx="62" cy="57" r="3" fill="#f5a0a0" opacity=".6"/><path d="M44 59 Q50 64 56 59" stroke="#8a3b2b" stroke-width="2" fill="none" stroke-linecap="round"/>`;
 if(h==='felicia')return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#4a2340"/><path d="M24 62 Q20 20 50 18 Q80 20 76 62 L78 88 L22 88Z" fill="#8a4a22"/><rect x="28" y="72" width="44" height="30" rx="14" fill="#e0457b"/>${face}<path d="M30 46 Q32 26 50 27 Q68 26 70 46 Q62 35 50 36 Q38 35 30 46Z" fill="#8a4a22"/><circle cx="69" cy="34" r="4" fill="#f1c40f"/></svg>`;
 return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1f3550"/><rect x="28" y="72" width="44" height="30" rx="14" fill="#3a7bd5"/>${face}<path d="M31 47 Q32 32 50 31 Q68 32 69 47 Q63 40 50 40 Q37 40 31 47Z" fill="#2b1d12"/><path d="M29 41 Q30 22 50 22 Q70 22 71 41Z" fill="#2ecc71"/><rect x="52" y="36" width="27" height="6" rx="3" fill="#1e8449"/></svg>`;
}

function floor(c){const ys=[460,474,492,516,548,600];const lx=y=>50-(y-460)*50/140,rx=y=>350+(y-460)*50/140;let s='';const cols=8;
 for(let r=0;r<ys.length-1;r++){const y1=ys[r],y2=ys[r+1];for(let i=0;i<cols;i++){const a=i/cols,b=(i+1)/cols;const w1=rx(y1)-lx(y1),w2=rx(y2)-lx(y2);
  const p=[[lx(y1)+w1*a,y1],[lx(y1)+w1*b,y1],[lx(y2)+w2*b,y2],[lx(y2)+w2*a,y2]].map(q=>q[0].toFixed(1)+','+q[1]).join(' ');
  const col=c.chk?((i+r)%2?c.fA:c.fB):(i%2?c.fA:c.fB);s+=`<polygon points="${p}" fill="${col}" stroke="${c.fl}" stroke-width=".6"/>`}}return s}
function room(th){const c=th.c;return `<polygon points="0,0 400,0 350,60 50,60" fill="${c.ceil}"/><polygon points="0,0 50,60 50,460 0,600" fill="${c.side}"/><polygon points="400,0 350,60 350,460 400,600" fill="${c.side}"/>${R(50,60,300,400,c.wall)}${floor(c)}${th.decor()}${R(50,448,300,12,c.base)}`}
function panel(x,d){let s=R(x,230,50,230,d.p,`stroke="${d.p2}" stroke-width="2"`);
 if(d.t==='win')s+=R(x+12,250,26,40,'#22343c',`stroke="${d.p2}" stroke-width="3"`)+Ln(x+16,256,x+22,264,'#5d7c88',1.5)+R(x+9,315,32,120,'none',`stroke="${d.p2}" stroke-width="2"`);
 if(d.t==='old')s+=R(x+8,245,34,85,'none',`stroke="${d.p2}" stroke-width="3"`)+R(x+8,345,34,100,'none',`stroke="${d.p2}" stroke-width="3"`)+P(`M${x+20} 230 l6 30 l-5 20 l8 25`,'none','stroke="#1a0d06" stroke-width="1.5"');
 if(d.t==='glass')s=R(x,230,50,230,'#bfe6f2','opacity=".5" stroke="#5a5f6b" stroke-width="4"')+Ln(x+10,300,x+30,262,'#fff',2,'opacity=".6"')+Ln(x+14,334,x+40,292,'#fff',1.5,'opacity=".4"');
 if(d.t==='teeth'){for(let i=0;i<5;i++)s+=P(`M${x+i*10} 230 l5 16 l5 -16Z`,'#f3eee0')+P(`M${x+i*10} 460 l5 -14 l5 14Z`,'#f3eee0');s+=E(x+25,310,11,7,'#f5f5f5')+C(x+25,310,4.5,'#c0392b','class="glow"')+C(x+25,310,2,'#000')}
 return s}
function doorSVG(th){const d=th.d,cls=G.open?(G.anim?'opening':'opened'):'';const num=G.w*5+G.l+1;const kn=G.lv.noKnob?'':C(207,345,3.6,'#d4af37');
 return R(144,224,112,236,d.f)+(G.open?R(150,230,100,230,'url(#passG)','class="glow"'):R(150,230,100,230,'#0c0808'))
 +`<g clip-path="url(#dc)"><g class="pl ${cls}">${panel(150,d)}${C(193,345,3.6,'#d4af37')}</g><g class="pr ${cls}">${panel(200,d)}${kn}${G.lv.doorDeco?G.lv.doorDeco(G.st):''}</g></g>`
 +R(180,203,40,18,d.f,'rx="3" stroke="#d4af37"')+T(200,216,num,12,'#f5e6b8','font-weight="bold"')
 +`<rect data-h="door" class="hs" x="150" y="230" width="100" height="230" fill="#000" opacity=".01"/>`}
function defs(th){return `<defs><clipPath id="dc"><rect x="150" y="230" width="100" height="230"/></clipPath><radialGradient id="passG" cx=".5" cy=".6" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="${th.light}"/><stop offset="1" stop-color="${th.light}" stop-opacity=".5"/></radialGradient><radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="${th.vig}"/></radialGradient><radialGradient id="fl" gradientUnits="userSpaceOnUse" cx="${G.fx}" cy="${G.fy}" r="105"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".55" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".97"/></radialGradient></defs>`}

function padSVG(ok,on=1){let s=R(264,300,32,48,'#2d3436','rx="4" stroke="#7f8c8d" stroke-width="2"')+R(268,304,24,9,on?(ok?'#2ecc71':'#0f3d1a'):'#111');for(let r=0;r<3;r++)for(let c=0;c<3;c++)s+=R(269+c*8,318+r*9,6,6,on?'#b2bec3':'#555','rx="1"');return s}
const readerSVG=ok=>R(264,298,30,46,'#2d3436','rx="4" stroke="#7f8c8d" stroke-width="2"')+R(270,306,18,4,'#000')+R(268,316,22,12,'#1e272e')+C(279,335,4,ok?'#2ecc71':'#e74c3c','class="glow"');
const frame=(x,y,w,h,inner)=>R(x,y,w,h,'#b8860b','stroke="#7a5a10" stroke-width="2"')+R(x+6,y+6,w-12,h-12,'#2b1d16')+inner;
const fuseBox=(on,x,y)=>R(x,y,60,72,'#95a5a6','rx="4" stroke="#555" stroke-width="2"')+P(`M${x+33} ${y+5} l-7 11 h5 l-3 9 l8 -12 h-5z`,'#f1c40f')+R(x+18,y+28,24,14,on?'#ecf0f1':'#1a1a1a','stroke="#555"')+(on?R(x+24,y+31,12,8,'#e74c3c'):'')+C(x+30,y+58,5,on?'#2ecc71':'#c0392b','class="glow"');
function scatter(n,zones){const pts=[];const area=zones.map(z=>(z[2]-z[0])*(z[3]-z[1]));const tot=area.reduce((a,b)=>a+b,0);let tries=0;
 while(pts.length<n&&tries<6000){tries++;let r=Math.random()*tot,zi=0;while(r>area[zi]){r-=area[zi];zi++}const z=zones[zi];const x=z[0]+Math.random()*(z[2]-z[0]),y=z[1]+Math.random()*(z[3]-z[1]);if(pts.every(p=>Math.hypot(p[0]-x,p[1]-y)>(tries<4000?31:24)))pts.push([x,y])}
 while(pts.length<n)pts.push([62+Math.random()*76,90+Math.random()*340]);return pts}
function rseq(n){const a=[];while(a.length<n){const c=Math.floor(Math.random()*4);if(c!==a[a.length-1])a.push(c)}return a}

/* ================= GÅTE-TYPER ================= */
const base=k=>({k,scare:k.scare,chase:k.chase});
function nu(){say('noUse');G.sel=null;drawInv();return true}
const NOMORE=L('Ikke noe mer her.','Nothing more here.');

/* 1: Finn skjult nøkkel */
function B1(k){return{...base(k),
 init:()=>({mv:{},t:{},got:0}),
 doorDeco:()=>keyhole(),
 draw(st){let s='';for(const p of k.spots){const sh=p.taps&&!st.mv[p.id]&&Date.now()-(st.shk||0)<360;s+=hs(p.id,`<g ${sh?'class="shk"':''}>${p.draw(!!st.mv[p.id])}</g>`);if(p.key&&st.mv[p.id]&&!st.got)s+=pick(k.item,'getkey',p.kx,p.ky)}return s},
 click(id,st,sel){const p=k.spots.find(q=>q.id===id);
  if(p){if(sel)return nu();
   if(!st.mv[id]){if(p.taps){if(!G.askedMotion&&window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission){G.askedMotion=1;DeviceMotionEvent.requestPermission().catch(()=>{})}st.t[id]=(st.t[id]||0)+1;st.shk=Date.now();if(st.t[id]<p.taps){SFX.thud();say(p.tapMsg);return true}}
    st.mv[id]=1;SFX.whoosh();say(p.key?p.msg:p.empty);return true}
   say(p.key&&!st.got?L('Noe glinser der!','Something is shining there!'):(p.empty||NOMORE));return true}
  if(id==='getkey'){st.got=1;give(k.item);return true}
  if(id==='door'){if(sel===k.item){use(k.item);openDoor();return true}if(sel)return nu();SFX.locked();say(L('Døren er låst. Jeg ser et nøkkelhull.','The door is locked. I can see a keyhole.'));return true}},
 onShake(st){const p=k.spots.find(q=>q.taps&&!st.mv[q.id]);if(p)this.click(p.id,st,null)},
 hint(st){const kp=k.spots.find(p=>p.key);return !st.mv[kp.id]?k.h0:!st.got?L('Plukk opp nøkkelen.','Pick up the key.'):L('Trykk på nøkkelen nederst for å velge den, og trykk så på døren.','Tap the key at the bottom to select it, then tap the door.')}
}}

/* 2: Tell ting -> kode */
const Z2=[[62,84,138,440],[262,84,340,288],[262,362,340,440],[42,484,272,586]];
function B2(k){return{...base(k),
 init(){const counts=k.cats.map(()=>1+Math.floor(Math.random()*k.max));const pts=scatter(counts.reduce((a,b)=>a+b,0),Z2);const objs=[];let i=0;counts.forEach((c,ci)=>{for(let j=0;j<c;j++){const p=pts[i++];objs.push([ci,Math.round(p[0]),Math.round(p[1])])}});for(let j=objs.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[objs[j],objs[r]]=[objs[r],objs[j]]}return{code:counts.join(''),objs,hi:0}},
 isDark:()=>!!k.dark,
 draw(st){let s='';for(const [ci,x,y] of st.objs)s+=hs('o'+ci,k.cats[ci].d(x,y));s+=hs('clue',HIT(150,80,100,112)+k.clue(k.cats));s+=hs('pad',padSVG(st.ok));return s},
 click(id,st,sel){
  if(id==='door'){if(sel)return nu();SFX.locked();say(L('Døren er låst. Panelet ved siden av vil ha en kode.','The door is locked. The panel next to it wants a code.'));return true}
  if(sel)return nu();
  if(/^o\d$/.test(id)){say(k.cats[+id[1]].n);return true}
  if(id==='clue'){say(k.clueMsg);return true}
  if(id==='pad'){keypad(3,v=>v===st.code,()=>{st.ok=1;openDoor()});return true}},
 hint(st){const h=[L('Se på hintet over døren.','Look at the clue above the door.'),L('Tell hvor mange det er av hver ting i rommet. Tallene i samme rekkefølge som over døren er koden.','Count how many there are of each thing in the room. The numbers in the same order as above the door make the code.'),L('Trykk på kodepanelet til høyre for døren og tast inn koden.','Tap the keypad right of the door and enter the code.')];if(k.dark)h.splice(1,0,L('Det er mørkt! Dra fingeren eller musen rundt for å lyse med lommelykten.','It is dark! Drag your finger or mouse around to use the flashlight.'));return h[st.hi++%h.length]}
}}

/* 3: Verktøy -> kasse -> belønning */
function B3(k){return{...base(k),noKnob:k.target==='handle',
 init:()=>({}),
 doorDeco(st){if(k.target==='door')return keyhole();if(k.target==='handle')return st.hin?R(203,338,9,15,'#b8860b','rx="2"')+R(206,342,22,6,'#d4a017','rx="3"'):R(203,338,9,15,'#1a0d06','rx="2"')+C(207.5,345,2.5,'#000');return''},
 draw(st){let s=hs('box',k.box(!!st.bo));if(st.bo&&!st.tg)s+=pick(k.tool,'tool',...k.tp);s+=hs('crate',k.crate(!!st.br));if(st.br&&!st.rg)s+=pick(k.rew,'rew',...k.rp);if(k.target==='reader')s+=hs('reader',readerSVG(st.done));return s},
 click(id,st,sel){
  if(id==='box'){if(sel)return nu();if(!st.bo){st.bo=1;SFX.whoosh();say(k.boxMsg)}else say(st.tg?NOMORE:L('Der ligger noe!','There is something there!'));return true}
  if(id==='tool'){st.tg=1;give(k.tool);return true}
  if(id==='crate'){if(st.br){if(sel)return nu();say(st.rg?L('Den er tom nå.','It is empty now.'):L('Noe ligger i restene!','Something is in the wreck!'));return true}
   if(sel===k.tool){use(k.tool);st.br=1;SFX.smash();shakeScreen();say(k.smashMsg);return true}if(sel)return nu();SFX.locked();say(k.crateMsg);return true}
  if(id==='rew'){st.rg=1;give(k.rew);return true}
  if(id==='reader'){if(sel==='card'){use('card');st.done=1;SFX.good();openDoor();return true}if(sel)return nu();say(L('En kortleser. Den lyser rødt.','A card reader. It glows red.'));return true}
  if(id==='door'){if(k.target==='door'&&sel===k.rew){use(k.rew);openDoor();return true}
   if(k.target==='handle'&&sel==='handle'){use('handle');st.hin=1;openDoor();return true}
   if(sel)return nu();SFX.locked();say(k.doorMsg);return true}},
 hint(st){return !st.bo?k.h0:!st.tg?L('Ta verktøyet du fant.','Take the tool you found.'):!st.br?L('Velg verktøyet nederst og trykk på kassa.','Select the tool at the bottom and tap the crate.'):!st.rg?L('Ta det som lå inni.','Take what was inside.'):k.h4}
}}

/* 4: Farge-rekkefølge over døren */
const BP=[[180,112],[220,112],[180,152],[220,152]];
function B4(k){return{...base(k),
 init:()=>({seq:rseq(k.n),inp:[],seen:0,cf:-1,bf:-1,hi:0}),
 draw(st){let s=hs('clue',k.clue(st));s+=R(154,88,92,88,'#161616','rx="12" stroke="#777" stroke-width="3"');
  BP.forEach(([x,y],i)=>s+=hs('b'+i,C(x,y,17,COL[i].c,`opacity="${st.bf===i?1:.72}" stroke="${st.bf===i?'#fff':'#000'}" stroke-width="3"`)+(st.bf===i?C(x,y,24,COL[i].c,'opacity=".35"'):'')));
  const n=st.seq.length;for(let i=0;i<n;i++)s+=C(200-(n-1)*7+i*14,188,3.6,i<st.inp.length?'#2ecc71':'#444');return s},
 click(id,st,sel){
  if(/^b\d$/.test(id)){if(sel)nu();if(G.open)return true;const i=+id[1];st.bf=i;tone(NOTE[i],.25,'sine',.25);later(()=>{st.bf=-1;drawScene()},200);st.inp.push(i);
   if(st.seq[st.inp.length-1]!==i){st.inp=[];later(()=>{SFX.wrong();say(L('Feil rekkefølge! Prøv igjen fra starten.','Wrong order! Try again from the start.'))},220)}
   else if(st.inp.length===st.seq.length){later(()=>{SFX.good();openDoor()},300)}return true}
  if(id==='clue'){if(sel)return nu();st.seen=1;if(k.simon)playSeq(st);say(k.clueMsg);return true}
  if(id==='door'){if(sel)return nu();SFX.locked();say(L('Døren har ingen nøkkelhull... men knappene over den lyser.','The door has no keyhole... but the buttons above it are glowing.'));return true}},
 hint(st){if(!st.seen)return k.h0;const h=[k.h1,L('Trykk knappene i samme rekkefølge. Gjør du feil, må du begynne på nytt.','Press the buttons in the same order. If you make a mistake, start over.')];return h[st.hi++%2]}
}}
function playSeq(st){if(st.playing)return;st.playing=1;let t=350;st.seq.forEach(c=>{later(()=>{st.cf=c;tone(NOTE[c],.35,'sine',.2);drawScene()},t);t+=480;later(()=>{st.cf=-1;drawScene()},t);t+=180});later(()=>{st.playing=0},t)}

/* 5: Kombinasjon: strøm + kode */
function B5(k){return{...base(k),
 init:()=>({code:Array.from({length:4},()=>1+Math.floor(Math.random()*9)).join('')}),
 isDark:st=>!st.on,
 draw(st){let s=hs('a',k.a(!!st.ad));if(st.ad&&!st.sg)s+=pick('skey','sk',...k.sp);s+=hs('dr',k.dr(!!st.dro));if(st.dro&&!st.pg)s+=pick(k.part,'pt',...k.pp);s+=hs('fb',k.box(!!st.on));s+=hs('cd',HIT(150,80,100,112)+k.code(!!st.on,st.code));s+=hs('pad',padSVG(st.ok,st.on));return s},
 click(id,st,sel){
  if(id==='a'){if(sel)return nu();if(!st.ad){st.ad=1;SFX.whoosh();say(k.aMsg)}else say(NOMORE);return true}
  if(id==='sk'){st.sg=1;give('skey');return true}
  if(id==='dr'){if(st.dro){if(sel)return nu();say(st.pg?L('Tomt.','Empty.'):L('Noe ligger der!','Something is there!'));return true}
   if(sel==='skey'){use('skey');st.dro=1;SFX.unlock();say(k.drMsg);return true}if(sel)return nu();SFX.locked();say(k.drLock);return true}
  if(id==='pt'){st.pg=1;give(k.part);return true}
  if(id==='fb'){if(st.on){if(sel)return nu();say(L('Strømmen er på.','The power is on.'));return true}
   if(sel===k.part){use(k.part);st.on=1;SFX.power();say(k.onMsg);if(k.scarePower)later(()=>scare(),900);return true}if(sel)return nu();say(k.boxMsg);return true}
  if(id==='cd'){if(sel)return nu();say(st.on?L('Det står: '+st.code,'It says: '+st.code):k.cdDark);return true}
  if(id==='pad'){if(sel)return nu();if(!st.on){SFX.locked();say(L('Kodepanelet er dødt. Det trengs strøm.','The keypad is dead. It needs power.'));return true}keypad(4,v=>v===st.code,()=>{st.ok=1;openDoor()});return true}
  if(id==='door'){if(sel)return nu();SFX.locked();say(L('Døren er låst med et kodepanel.','The door is locked with a keypad.'));return true}},
 hint(st){const h=[k.h0,L('Plukk opp den lille nøkkelen.','Pick up the small key.'),k.h2,L('Plukk opp det du fant.','Pick up what you found.'),k.h4,k.h5];return h[!st.ad?0:!st.sg?1:!st.dro?2:!st.pg?3:!st.on?4:5]}
}}

   clue:st=>E(102,150,42,54,'#14040a','stroke="#5a0f22" stroke-width="3"')+[86,118].map(x=>E(x,136,11,13,st.cf>=0?COL[st.cf].c:'#3a0a14')+C(x,136,3,'#000')).join('')+P('M80 174 Q102 190 124 174','none','stroke="#5a0f22" stroke-width="3"')+[86,94,102,110,118].map(x=>Ln(x,172,x,186,'#5a0f22',2)).join(''),
   clueMsg:L('Øynene i veggen blinker i farger. Følg med!','The eyes in the wall flash colors. Watch closely!'),
   scare:{draw:o=>`<g ${rot(o,10,340,586)}>${P('M292 584 Q340 600 388 580','none','stroke="#5e0f1f" stroke-width="5"')}${Ln(310,584,320,548,'#5e0f1f',4)}${Ln(370,584,360,548,'#5e0f1f',4)}${E(340,540,32,13,'#7a1428')}${P('M368 540 L380 506 L394 512 L384 540Z','#7a1428')}${C(386,512,2.5,o?'#f00':'#111')}</g>`,
    msg:L('Gyngehesten vrinsket og stirret med røde øyne!','The rocking horse neighed and stared with red eyes!'),calm:L('En gammel gyngehest.','An old rocking horse.'),after:L('Den gynger av seg selv...','It is rocking by itself...')}}),
  B5({part:'bulb',sp:[300,574],pp:[66,520],scarePower:1,chase:170,
   a:d=>P('M284 512 L332 472 L380 512Z','#5e0f1f')+R(290,512,84,74,d?'#1a0610':'#7a1428')+(d?C(312,540,5,'#f0d9c9')+C(348,540,5,'#f0d9c9')+C(310,539,1,'#000')+C(314,539,1,'#000')+C(346,539,1,'#000')+C(350,539,1,'#000')+R(306,546,12,16,'#8a1c2b')+R(342,546,12,16,'#2c2c54'):R(300,524,20,18,'#f9e79f','opacity=".6"')+R(344,524,20,18,'#f9e79f','opacity=".6"')+R(322,556,20,30,'#3a0a14')),
   aMsg:L('I dukkehuset lå en liten nøkkel. Dukkene har snudd seg mot deg...','In the dollhouse was a small key. The dolls have turned towards you...'),
   dr:o=>R(20,500,92,86,'#3a1020','stroke="#1a0610" stroke-width="2"')+(o?R(14,506,104,26,'#4a1428')+R(20,510,92,14,'#0a0204'):R(26,508,80,24,'#4a1428')+R(62,514,7,9,'#b7950b','rx="1"'))+R(26,540,80,36,'#4a1428')+R(40,470,10,30,'#888')+E(45,470,16,8,'#5a1a2a'),
   drMsg:L('Nattbordskuffen er åpen. En lyspære!','The nightstand drawer is open. A light bulb!'),drLock:L('Nattbordet er låst.','The nightstand is locked.'),
   box:on=>R(96,108,14,10,'#555')+P('M80 118 L126 118 L116 142 L90 142Z',on?'#f9e79f':'#3a1020','stroke="#111"')+C(103,148,7,on?'#fffde0':'#222','stroke="#555"')+(on?E(103,170,56,40,'#fff59d','opacity=".18"'):''),
   boxMsg:L('Vegglampen mangler lyspære.','The wall lamp has no light bulb.'),onMsg:L('Lyset er på! Mørket trekker seg tilbake... nesten.','The light is on! The darkness backs away... almost.'),
   code:(on,c)=>on?T(200,140,c.split('').join(' '),30,'#ff4d6d','font-weight="bold" stroke="#300" stroke-width="1"')+T(200,170,tx(L('SLIPP UT!','LET ME OUT!')),11,'#ff4d6d'):'',cdDark:L('Det er noe skrevet på veggen, men det er for mørkt.','Something is written on the wall, but it is too dark.'),
   h0:L('Mørkt og monsteret kommer! Lys på dukkehuset.','Dark and the monster is coming! Shine on the dollhouse.'),h2:L('Bruk den lille nøkkelen på nattbordet.','Use the small key on the nightstand.'),h4:L('Sett lyspæra i vegglampen til venstre.','Put the bulb in the wall lamp on the left.'),h5:L('Koden står på veggen over døren. Tast den inn – fort!','The code is on the wall above the door. Enter it – fast!')})
 ]}
];

/* ================= SPILLMOTOR ================= */
let G=null;
function later(fn,ms){const g=G;if(!g)return;g.timers.push(setTimeout(()=>{if(G===g)fn()},ms))}
function say(o){const m=$('#msg');if(!m)return;m.innerHTML=`<span class="av">${heroSVG(S.hero)}</span><span class="tx">${tx(o)}</span>`;m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop')}
function give(id){G.inv.push(id);SFX.pick();say(L(`${UI.no.found}: ${ITEMS[id].no}!`,`${UI.en.found}: ${ITEMS[id].en}!`));drawInv()}
function use(id){const i=G.inv.indexOf(id);if(i>=0)G.inv.splice(i,1);G.sel=null;drawInv()}
function shakeScreen(){const s=$('#stage');if(!s)return;s.classList.remove('shakeScreen');void s.offsetWidth;s.classList.add('shakeScreen')}
function scare(force){if(!S.scary&&!force)return false;const el=$('#scare');el.innerHTML=`<svg viewBox="0 0 200 200">${MON[G?G.world.mon:'school']}</svg>`;el.classList.remove('on');void el.offsetWidth;el.classList.add('on');SFX.scare();try{navigator.vibrate&&navigator.vibrate([200,60,250])}catch(e){}const g=G;if(g)g.busy=true;setTimeout(()=>{el.classList.remove('on');if(g)g.busy=false},1050);return true}
function openDoor(){if(G.open)return;G.open=true;G.anim=true;G.peek=null;SFX.unlock();later(()=>SFX.door(),300);S.prog[G.w]=Math.max(S.prog[G.w],G.l+1);save();say('enter');const c=$('#chase');if(c)c.hidden=true;drawScene();G.anim=false}
function drawInv(){const el=$('#inv');if(!el||!G)return;el.innerHTML=Array.from({length:6},(_,i)=>{const id=G.inv[i];return `<button class="slot ${id&&G.sel===id?'sel':''}" data-i="${i}">${id?`<svg viewBox="0 0 40 40">${ICON[id]}</svg>`:''}</button>`}).join('')}
function drawScene(){if(!G)return;const svg=$('#scene');if(!svg)return;const th=G.world,lv=G.lv,st=G.st;
 let s=defs(th)+room(th)+doorSVG(th)+lv.draw(st);
 if(lv.scare)s+=hs('scare',lv.scare.draw(!!st.sc));
 s+=R(0,0,400,600,'url(#vig)','pointer-events="none"');
 if(lv.isDark&&lv.isDark(st)&&!G.open)s+=R(0,0,400,600,'url(#fl)','pointer-events="none"');
 if(G.peek){const [x,y]=G.peek;s+=hs('peek',`<g class="peek">${C(x,y,18,'#000','opacity=".01"')}${E(x-6,y,3.2,2.4,'#ff2a2a')}${E(x+6,y,3.2,2.4,'#ff2a2a')}${C(x-6,y,7,'#ff2a2a','opacity=".25"')}${C(x+6,y,7,'#ff2a2a','opacity=".25"')}</g>`)}
 svg.innerHTML=s}
function onHot(id){if(!G||G.busy)return;
 if(id==='peek'){G.peek=null;if(!scare())say(L('Var det noen der?','Was someone there?'));drawScene();return}
 if(id==='door'&&G.open){nextLevel();return}
 SFX.click();
 if(id==='scare'){const o=G.lv.scare,st=G.st;if(G.sel){nu();return}if(o.sfx)SFX[o.sfx]();if(!st.sc){st.sc=1;if(S.scary){if(o.delay)later(()=>scare(),o.delay);else scare();say(o.msg)}else say(o.calm)}else say(S.scary?o.after:o.calm);drawScene();return}
 const r=G.lv.click(id,G.st,G.sel);
 if(!r){if(G.sel)nu();else say('nothing')}
 drawScene()}
function keypad(len,check,ok){const ov=$('#ov');let v='';
 const upd=()=>{$('#pd').textContent=(v+'_'.repeat(len)).slice(0,len)};
 ov.innerHTML=`<div class="pad" id="padbox"><div class="disp" id="pd"></div><div class="keys">${[1,2,3,4,5,6,7,8,9,'C',0,'⏎'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div><button class="x" data-k="X">${tx('close')}</button></div>`;ov.hidden=false;upd();
 const submit=()=>{if(check(v)){SFX.good();ov.hidden=true;ok()}else{SFX.wrong();const p=$('#padbox');p.classList.remove('bad');void p.offsetWidth;p.classList.add('bad');say('wrongCode');v='';upd()}};
 ov.onclick=e=>{if(e.target===ov){ov.hidden=true;return}const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
  if(k==='X'){ov.hidden=true;return}if(k==='C'){v='';SFX.click();upd();return}if(k==='⏎'){if(v.length===len)submit();else SFX.wrong();return}
  if(v.length<len){v+=k;SFX.beep();upd();if(v.length===len)setTimeout(submit,220)}}}
function peekTick(){if(!G||G.peek||G.open||G.busy||!S.scary||!$('#ov').hidden)return;if(Math.random()<G.world.peekRate){const p=G.world.peek;G.peek=p[Math.floor(Math.random()*p.length)];SFX.whisper();drawScene();later(()=>{G.peek=null;drawScene()},2200)}}
function chaseTick(){const c=G&&G.chase;if(!c||G.open||G.busy)return;c.t+=.25;const p=Math.min(1,c.t/c.max);const b=$('#cbar');if(b)b.style.width=(p*100)+'%';c.hb-=.25;if(c.hb<=0){SFX.heart();c.hb=Math.max(.35,1.6-p*1.3)}
 if(c.t>=c.max){c.t=0;const g=G;$('#ov').hidden=true;if(!scare(true))SFX.wrong();setTimeout(()=>{if(G===g){startLevel(g.w,g.l,true);say('caught')}},1150)}}
function clearG(){if(G)G.timers.forEach(t=>{clearTimeout(t);clearInterval(t)});stopAmb()}
function startLevel(w,l,retry){clearG();const world=WORLDS[w],lv=world.levels[l];
 G={w,l,world,lv,st:lv.init(),inv:[],sel:null,open:false,anim:false,peek:null,busy:false,fx:200,fy:380,timers:[],chase:lv.chase?{t:0,max:lv.chase,hb:1.5}:null};
 scrGame();drawScene();drawInv();startAmb(world);
 G.timers.push(setInterval(peekTick,1000));if(G.chase)G.timers.push(setInterval(chaseTick,250));
 if(!retry)say(l===0?world.intro(heroName()):(lv.chase?L('Noe kommer! Skynd deg!','Something is coming! Hurry!'):L(`Dør ${w*5+l+1}. Hvordan kommer jeg meg ut herfra?`,`Door ${w*5+l+1}. How do I get out of here?`)))}
function nextLevel(){SFX.step();const w=G.w,l=G.l;fade(()=>{if(l<4)startLevel(w,l+1);else scrWin(w)})}
function fade(fn){const f=$('#fade');f.classList.add('on');setTimeout(()=>{fn();f.classList.remove('on')},430)}
function svgPt(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:200,y:300}}
let lastShake=0;
window.addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a||!G||!G.lv.onShake||G.busy)return;const m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);if(m>32&&Date.now()-lastShake>550){lastShake=Date.now();G.lv.onShake(G.st);drawScene()}});

/* ================= SKJERMER ================= */
const render=h=>{$('#app').innerHTML=h};
function logoSVG(){return `<svg viewBox="0 0 110 140"><rect x="5" y="5" width="100" height="135" rx="4" fill="#3a2212"/><rect x="15" y="15" width="80" height="125" fill="#fff3c4"/><rect x="15" y="15" width="80" height="125" fill="url(#lg)"/><defs><radialGradient id="lg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f2c14e"/></radialGradient></defs><path d="M15 15 L55 25 L55 135 L15 140Z" fill="#7a4f26"/><circle cx="48" cy="80" r="3" fill="#f2c14e"/><ellipse cx="78" cy="70" rx="4" ry="3" fill="#c0392b"/><ellipse cx="90" cy="70" rx="4" ry="3" fill="#c0392b"/></svg>`}
function scrStart(){clearG();G=null;
 render(`<div class="screen menu"><div class="logo">${logoSVG()}</div><h1>${tx('title')}</h1><p class="sub">${tx('sub')}</p>
 <div class="row"><button class="chip ${S.lang==='no'?'on':''}" data-lang="no">Norsk</button><button class="chip ${S.lang==='en'?'on':''}" data-lang="en">English</button></div>
 <button class="big" id="play">${tx('play')}</button>
 <div class="row"><button class="chip" id="tSc">👻 ${tx('scary')}: ${tx(S.scary?'on':'off')}</button><button class="chip" id="tSd">${S.sound?'🔊':'🔇'} ${tx('sound')}: ${tx(S.sound?'on':'off')}</button></div>
 <p class="small">${tx('offline')}</p><button class="link" id="rst">${tx('reset')}</button></div>`);
 document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;document.documentElement.lang=S.lang==='no'?'no':'en';save();SFX.click();scrStart()});
 $('#play').onclick=()=>{ac();SFX.good();scrHero()};
 $('#tSc').onclick=()=>{S.scary=!S.scary;save();SFX.click();scrStart()};
 $('#tSd').onclick=()=>{S.sound=!S.sound;save();ac();SFX.click();scrStart()};
 $('#rst').onclick=()=>{if(confirm(tx('resetQ'))){S.prog=[0,0,0,0];save();scrStart()}}}
function scrHero(){render(`<div class="screen menu"><h2>${tx('choose')}</h2><div class="heroes">${Object.keys(HEROES).map(h=>`<button class="hero ${S.hero===h?'on':''}" data-h="${h}">${heroSVG(h)}<b>${HEROES[h].name}</b></button>`).join('')}</div><button class="chip" id="hb">‹ ${S.lang==='no'?'Tilbake':'Back'}</button></div>`);
 document.querySelectorAll('.hero').forEach(b=>b.onclick=()=>{S.hero=b.dataset.h;save();SFX.pick();scrWorlds()});$('#hb').onclick=scrStart}
const worldOpen=i=>i<3||S.prog.slice(0,3).every(p=>p>=5);
function preview(th){const d=th.d;return `<svg class="prev" viewBox="0 30 400 570" preserveAspectRatio="xMidYMid slice">${room(th)}${R(144,224,112,236,d.f)}${panel(150,d)}${panel(200,d)}</svg>`}
function scrWorlds(){clearG();G=null;
 render(`<div class="screen menu" style="justify-content:flex-start"><div class="wtop"><button class="back" id="wb">‹</button><h2>${tx('worlds')}</h2><span style="width:44px">${heroSVG(S.hero).replace('<svg','<svg width="44" height="44"')}</span></div>
 <div class="worlds">${WORLDS.map((w,i)=>{const p=S.prog[i],open=worldOpen(i);return `<div class="wc"><div data-w="${i}">${preview(w)}</div><h3>${tx(w.name)}</h3><div class="dots">${[0,1,2,3,4].map(j=>`<button data-w="${i}" data-l="${j}" class="${j<p?'done':j===Math.min(p,4)&&p<5?'next':''}" ${open&&j<=p?'':'disabled'}>${i*5+j+1}</button>`).join('')}</div>${open?'':`<div class="lk"><b>🔒</b>${tx('lockedWorld')}</div>`}</div>`}).join('')}</div>
 <p class="small">${S.lang==='no'?'Trykk på et bilde for å fortsette, eller velg en dør du har klart.':'Tap a picture to continue, or pick a door you have cleared.'}</p></div>`);
 $('#wb').onclick=scrHero;
 document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const w=+b.dataset.w;if(!worldOpen(w))return;const l=b.dataset.l!=null?+b.dataset.l:Math.min(S.prog[w]>=5?0:S.prog[w],4);ac();SFX.step();fade(()=>startLevel(w,l))})}
function scrGame(){const w=G.world;
 render(`<div class="screen game"><div class="top"><button id="gB">‹</button><div class="ttl">${tx(w.name)}<small>${tx('door')} ${G.w*5+G.l+1} / 20</small></div><button id="gH" title="${tx('hint')}">💡</button><button id="gS">${S.sound?'🔊':'🔇'}</button></div>
 <div class="stage" id="stage"><svg id="scene" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet"></svg>${G.chase?`<div id="chase"><span>👹</span><div class="bar"><i id="cbar"></i></div><span>${tx('chase')}</span></div>`:''}</div>
 <div class="msg" id="msg"></div><div class="inv" id="inv"></div><div class="ov" id="ov" hidden></div></div>`);
 const svg=$('#scene');
 svg.addEventListener('click',e=>{const h=e.target.closest('[data-h]');if(h)onHot(h.dataset.h)});
 const mv=e=>{if(!G)return;const p=svgPt(svg,e);G.fx=p.x;G.fy=p.y;const g=svg.querySelector('#fl');if(g){g.setAttribute('cx',p.x);g.setAttribute('cy',p.y)}};
 svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);
 $('#inv').onclick=e=>{const b=e.target.closest('.slot');if(!b||!G)return;const id=G.inv[+b.dataset.i];if(!id)return;SFX.click();G.sel=G.sel===id?null:id;if(G.sel)say(L(`${UI.no.selected}: ${ITEMS[id].no}. ${UI.no.tapUse}`,`${UI.en.selected}: ${ITEMS[id].en}. ${UI.en.tapUse}`));drawInv()};
 $('#gB').onclick=()=>{SFX.click();scrWorlds()};
 $('#gH').onclick=()=>{SFX.click();const h=G.lv.hint(G.st);say(L('💡 '+h.no,'💡 '+h.en))};
 $('#gS').onclick=()=>{S.sound=!S.sound;save();$('#gS').textContent=S.sound?'🔊':'🔇';if(S.sound){ac();startAmb(G.world)}else stopAmb()}}
function scrWin(w){clearG();G=null;SFX.win();const all=S.prog.every(p=>p>=5);const cols=['#f1c40f','#e74c3c','#3498db','#2ecc71','#e84393'];
 const conf=Array.from({length:36},(_,i)=>`<span class="conf" style="left:${Math.random()*100}%;background:${cols[i%5]};animation-duration:${2+Math.random()*3}s;animation-delay:${-Math.random()*3}s"></span>`).join('');
 const nextW=w<3&&worldOpen(w+1)?w+1:-1;
 render(`<div class="screen win">${conf}<div class="hb">${heroSVG(S.hero)}</div><h1>${tx('win')}</h1><p class="sub">${heroName()} ${tx('escaped')} ${tx(WORLDS[w].name).toLowerCase()}!</p>${all?`<p class="sub" style="font-weight:800;color:#f2c14e">🏆 ${tx('allDone')}</p>`:''}
 ${nextW>=0?`<button class="big" id="wn">${tx('next')}</button>`:''}<button class="chip" id="wm">${tx('menu')}</button></div>`);
 if(nextW>=0)$('#wn').onclick=()=>fade(()=>startLevel(nextW,S.prog[nextW]>=5?0:S.prog[nextW]));
 $('#wm').onclick=scrWorlds}

/* ================= START ================= */
load();document.documentElement.lang=S.lang==='no'?'no':'en';scrStart();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
