.start{background:radial-gradient(ellipse at 50% 110%,rgba(140,0,20,.45),transparent 60%),radial-gradient(circle at 50% 30%,#1a0a10,#050204 75%);overflow:hidden}
.fog{position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 60%,rgba(120,120,130,.10),transparent 40%),radial-gradient(ellipse at 70% 40%,rgba(120,110,120,.08),transparent 45%);animation:fog 18s ease-in-out infinite alternate;pointer-events:none}
@keyframes fog{to{transform:translateX(8%) translateY(-3%) scale(1.1)}}
.eyes{position:absolute;width:26px;height:8px;pointer-events:none;opacity:0;animation:eyes 7s infinite}
.eyes:before,.eyes:after{content:'';position:absolute;top:0;width:8px;height:5px;border-radius:50%;background:#ff1a1a;box-shadow:0 0 8px #f00}
.eyes:before{left:0}.eyes:after{right:0}
@keyframes eyes{0%,62%,100%{opacity:0}66%,90%{opacity:.9}78%{transform:scaleY(.1)}80%{transform:none}}
.logo{position:relative;animation:flk 5s infinite}
@keyframes flk{0%,19%,23%,60%,63%,100%{opacity:1}20%,61%{opacity:.25}22%{opacity:.7}}
.ttl1{font-family:DoorsTitle,Impact,"Arial Black","Haettenschweiler",sans-serif;font-size:54px;letter-spacing:4px;color:#e9e1d2;margin:0;line-height:1;text-shadow:0 0 22px rgba(200,0,20,.8),0 4px 0 #000;animation:tf 6s infinite}
.ttl2{font-family:DoorsTitle,Impact,"Arial Black",sans-serif;font-size:34px;letter-spacing:14px;color:#b0000f;margin:-4px 0 0 14px;text-shadow:0 0 16px rgba(255,0,0,.6)}
.drip{display:block;width:240px;height:26px;margin:-6px auto 0}
@keyframes tf{0%,45%,49%,100%{opacity:1;transform:none}46%{opacity:.4;transform:translateX(-3px) skewX(-8deg)}48%{opacity:.85;transform:translateX(3px)}}
.credit{padding-top:10px;text-align:center;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#8a6a6a;opacity:.75}
.big.blood{background:linear-gradient(#9a0012,#4a0008);color:#f3e6d6;box-shadow:0 6px 0 #250003,0 0 34px rgba(220,0,30,.55);animation:bp 2.4s ease-in-out infinite}
@keyframes bp{50%{box-shadow:0 6px 0 #250003,0 0 50px rgba(255,0,30,.85)}}
.ico{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
#scene.flick{animation:flick .8s steps(1)}
@keyframes flick{0%{filter:brightness(.15)}12%{filter:none}24%{filter:brightness(.05)}40%{filter:none}55%{filter:brightness(.3)}70%,100%{filter:none}}
#scare.on svg{animation:zoom 1s ease-out forwards,glitch .12s steps(2) infinite}
@keyframes glitch{0%{filter:drop-shadow(6px 0 0 rgba(255,0,0,.8)) drop-shadow(-6px 0 0 rgba(0,255,255,.5))}50%{filter:drop-shadow(-5px 2px 0 rgba(255,0,0,.8)) drop-shadow(5px -2px 0 rgba(0,255,255,.5))}}
:root{--acc:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#2a1a2e,#0a070c 70%);color:#f3ead8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;justify-content:center}
.screen{width:100%;max-width:520px;height:100%;height:100dvh;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.menu{align-items:center;justify-content:flex-start;gap:14px;padding:18px 16px;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.start .logo{margin-top:auto}.start .credit{margin-top:auto}
.hero-s{gap:12px}
.nl{font-size:13px;opacity:.75;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
#pname{width:100%;max-width:340px;font:600 19px system-ui,sans-serif;padding:12px 14px;border-radius:12px;border:2px solid #5a2030;background:#1a0d14;color:#f3ead8;text-align:center;outline:none}
#pname:focus{border-color:#c0001a;box-shadow:0 0 14px rgba(200,0,30,.4)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;width:100%;max-width:460px}
.avb{padding:0;border:3px solid transparent;border-radius:12px;overflow:hidden;aspect-ratio:1;background:#000;opacity:.8}
.avb img,.meav img{width:100%;height:100%;object-fit:cover;display:block}
.avb.on{border-color:#ff2a2a;box-shadow:0 0 14px rgba(255,0,30,.7);opacity:1;transform:scale(1.05)}
.meav{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid #c0001a;padding:0;flex:none;position:relative;z-index:2}
.msg .av img{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;border:2px solid #8a0010}
.win .hb img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #c0001a;box-shadow:0 0 30px rgba(255,0,30,.5);animation:bounce 1s ease-in-out infinite}
@media (max-height:740px){.logo svg{width:88px;height:110px}.ttl1{font-size:44px}.ttl2{font-size:28px}.drip{width:200px;height:20px}.menu{gap:10px}.big{padding:12px 40px;font-size:20px}.chip{padding:8px 12px}}
@media (max-width:380px){.ttl1{font-size:42px;letter-spacing:2px}.ttl2{letter-spacing:10px}}
.logo svg{width:120px;height:150px;filter:drop-shadow(0 0 24px rgba(242,193,78,.4))}
h1{font-size:40px;letter-spacing:5px;margin:0;font-weight:900;text-shadow:0 0 18px rgba(255,60,60,.55),0 3px 0 #000}
h1 span{font-size:26px;letter-spacing:10px;color:#f2c14e}
h2{margin:0;font-size:22px}
.sub{opacity:.85;margin:0;max-width:400px}
.big{background:linear-gradient(#f6cf65,#d99a1e);color:#2a1606;font-weight:900;font-size:22px;padding:14px 48px;border-radius:16px;box-shadow:0 6px 0 #8a5a10,0 10px 30px rgba(0,0,0,.5)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #8a5a10}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{background:#2a2030;padding:10px 16px;border-radius:12px;border:2px solid #3d3145;font-weight:600}
.chip.on{border-color:var(--acc);background:#3a2c1a}
.small{font-size:12px;opacity:.6;margin:0}
.link{font-size:12px;opacity:.5;text-decoration:underline}
.heroes{display:flex;gap:14px}
.hero{background:#21182a;border:3px solid #3d3145;border-radius:18px;padding:14px;width:150px}
.hero.on{border-color:var(--acc);box-shadow:0 0 18px rgba(242,193,78,.4)}
.hero svg{width:110px;height:110px}
.hero b{display:block;font-size:20px;margin-top:6px}
.wtop{display:flex;align-items:center;gap:10px;width:100%}
.wtop h2{flex:1}
.back{width:44px;height:44px;border-radius:12px;background:#2a2030;font-size:22px;flex:none}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.wc{background:#1d1524;border:2px solid #3d3145;border-radius:16px;padding:8px;text-align:center}
.wc .prev{width:100%;height:118px;border-radius:10px;background:#000;display:block;cursor:pointer}
.wc h3{margin:6px 0 2px;font-size:16px}
.wc .pr{font-size:12px;opacity:.8}
.pbar{height:6px;background:#000;border-radius:4px;overflow:hidden;margin:5px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#2ecc71,#f2c14e)}
.wc .row{gap:6px}
.wc .row button{padding:7px 10px;border-radius:9px;background:#3a2c3f;font-size:13px;font-weight:700}
.wc .row button.go{background:#8a0010;color:#f3e6d6;flex:1}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;width:100%;max-width:400px}
.grid button{aspect-ratio:1;border-radius:5px;background:#3a2c3f;font-size:11px;font-weight:800;color:#ccc}
.grid button.done{background:#2ecc71;color:#063}
.grid button.cur{background:var(--acc);color:#2a1606}
.grid button:disabled{opacity:.25;cursor:default}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(0,0,0,.45)}
.top button{width:42px;height:42px;border-radius:12px;background:#2a2030;font-size:20px;flex:none}
.ttl{flex:1;text-align:center;font-weight:800;font-size:16px}
.ttl small{display:block;font-weight:500;opacity:.75;font-size:12px}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
#scene{width:100%;height:100%;display:block;touch-action:none;transform-origin:50% 58%}
#scene.walk{animation:walk .95s ease-in forwards}
#scene.arrive{animation:arrive .6s ease-out}
@keyframes walk{0%{transform:none}25%{transform:scale(1.18) translateY(5px)}50%{transform:scale(1.55) translateY(-4px)}75%{transform:scale(2.1) translateY(5px)}100%{transform:scale(3.2);opacity:.2}}
@keyframes arrive{0%{transform:scale(1.25);opacity:.2}100%{transform:none;opacity:1}}
#hand{position:absolute;right:-4px;bottom:-8px;width:40%;max-width:190px;pointer-events:none;transform:translateY(115%) rotate(8deg);transition:transform .25s ease-out;z-index:5}
#hand.up{transform:none}
#hand.poke{animation:poke .4s}
@keyframes poke{40%{transform:translate(-30px,-40px) scale(.9)}}
#hand svg{width:100%;display:block}
.msg{min-height:60px;display:flex;align-items:center;gap:10px;padding:6px 12px;background:rgba(0,0,0,.55);font-size:15px;line-height:1.25}
.msg .av svg{width:42px;height:42px;display:block}
.msg.pop .tx{animation:pop .35s}
.inv{display:flex;gap:6px;justify-content:center;padding:8px 8px 10px;background:linear-gradient(#2a1f18,#17110c);border-top:3px solid #5a4030}
.slot{width:52px;height:52px;border-radius:10px;background:#0f0a07;border:2px solid #4a3527;padding:4px}
.slot svg{width:100%;height:100%;display:block}
.slot.sel{border-color:#f2c14e;box-shadow:0 0 14px #f2c14e;background:#3a2a10}
#tmr{position:absolute;left:10px;right:10px;top:8px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#ff8a8a;pointer-events:none;text-shadow:0 1px 2px #000;z-index:4}
#tmr .bar{flex:1;height:11px;background:rgba(0,0,0,.7);border-radius:6px;overflow:hidden;border:1px solid #a33}
#tmr i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e74c3c,#f39c12);transition:width .25s linear}
#tmr.low{animation:blinkr .5s infinite}
@keyframes blinkr{50%{color:#fff}}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.ov[hidden]{display:none}
.pad{background:#1e2326;border:3px solid #556;border-radius:18px;padding:16px;width:270px}
.disp{background:#0b1a0b;color:#3f3;font:700 34px/1 ui-monospace,Consolas,monospace;letter-spacing:10px;text-align:center;padding:12px;border-radius:8px;margin-bottom:12px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:56px;border-radius:10px;background:#3b4248;font-size:24px;font-weight:700;box-shadow:0 3px 0 #1a1d20}
.keys button:active{transform:translateY(2px)}
.pad .x,.mem .x{width:100%;margin-top:10px;padding:10px;border-radius:10px;background:#55303a;font-weight:700}
.mem{background:#1e2326;border:3px solid #556;border-radius:18px;padding:14px;width:100%;max-width:340px;text-align:center}
.mem .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.mem .card{aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,#6c3483,#2e86de);box-shadow:0 3px 0 #111;font-size:26px;font-weight:900}
.mem .card.up{background:#f5f0e1}
.mem .card.ok{background:#b8f5c8}
.mem .card svg{width:80%;height:80%}
.bad{animation:shake .4s}
#scare,#eat{position:fixed;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center;overflow:hidden}
#scare.on{display:flex;animation:scareIn 1s ease-out forwards}
#scare svg{width:min(125vw,125vh);height:min(125vw,125vh);animation:zoom 1s ease-out forwards}
#eat.on{display:block}
#eat .em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#eat .em svg{width:min(110vw,110vh);height:min(110vw,110vh);animation:zoom 1.2s ease-out forwards}
#eat .jt,#eat .jb{position:absolute;left:0;right:0;height:52%}
#eat .jt{top:0;transform:translateY(-100%);animation:jt .5s .55s ease-in forwards}
#eat .jb{bottom:0;transform:translateY(100%);animation:jb .5s .55s ease-in forwards}
#eat .jt svg,#eat .jb svg{width:100%;height:100%;display:block}
#eat p{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:28px;font-weight:900;color:#fff;opacity:0;animation:fin .4s 1.2s forwards;text-shadow:0 0 12px #f00;margin:0;padding:0 16px}

function propClick(i){const R=G.room,p=R.props[i];

function onHot(id){if(!G||G.busy)return;const R=G.room;

 if(has('kh1')&&has('kh2'))return L('Du har to nøkkeldeler! Velg den ene nederst, og trykk så på den andre.','You have two key pieces! Select one at the bottom, then tap the other.');

 if(has('handle'))return L('Velg dørhåndtaket og trykk på døren.','Select the door handle and tap the door.');

 if(['fuse','battery','bulb'].some(has))return L('Sett delen du fant inn der strømmen mangler.','Put the part you found where the power is missing.');
 const locked=R.props.find(p=>p.lock&&!p.unl);const h=R.hintT&&R.hintT();if(h)return h;
 if(locked)return L('Noe er låst. Let etter det som kan åpne det.','Something is locked. Look for what can open it.');

 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const w=+b.dataset.go;ac();SFX.step();fade(()=>startRoom(w,S.cur[w]))});
 document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>scrPick(+b.dataset.pick))}
function scrPick(w){const mx=Math.max(S.best[w]+1,S.cur[w]);
 render(`<div class="screen menu" style="justify-content:flex-start"><div class="wtop"><button class="back" id="pb">‹</button><h2>${tx(WORLDS[w].name)}</h2><span style="width:44px"></span></div><p class="small">${tx('pickDoor')}</p>
 <div class="grid">${Array.from({length:100},(_,i)=>{const n=i+1;return `<button data-n="${n}" class="${n<=S.best[w]?'done':''} ${n===S.cur[w]?'cur':''}" ${n<=Math.min(100,mx)?'':'disabled'}>${n}</button>`}).join('')}</div></div>`);
 $('#pb').onclick=scrWorlds;document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ac();SFX.step();fade(()=>startRoom(w,+b.dataset.n))})}
function scrGame(){render(`<div class="screen game"><div class="top"><button id="gB">‹</button><div class="ttl">${tx(G.th.name)}<small>${tx('door')} ${G.n} / 100</small></div><button id="gH">💡</button><button id="gS">${S.sound?'🔊':'🔇'}</button></div>
 <div class="stage" id="stage"><svg id="scene" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet"></svg><div id="hand"></div>${G.timer?`<div id="tmr"><span>👹</span><div class="bar"><i id="tbar"></i></div><span id="tnum">${G.timer.max}${tx('timeLeft')}</span></div>`:''}</div>
 <div class="msg" id="msg"></div><div class="inv" id="inv"></div><div class="ov" id="ov" hidden></div></div>`);
 const svg=$('#scene');
 svg.addEventListener('click',e=>{const h=e.target.closest('[data-h]');if(h)onHot(h.dataset.h)});
 const mv=e=>{if(!G)return;const p=svgPt(svg,e);G.fx=p.x;G.fy=p.y;const g=svg.querySelector('#fl');if(g){g.setAttribute('cx',p.x);g.setAttribute('cy',p.y)}};
 svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);
 $('#inv').onclick=e=>{const b=e.target.closest('.slot');if(!b||!G||G.busy)return;const id=G.inv[+b.dataset.i];if(!id)return;
  if(G.sel&&G.sel!==id){const k=[G.sel,id].sort().join('+');if(COMBO[k]){const a=G.sel;G.inv.splice(G.inv.indexOf(a),1);G.inv.splice(G.inv.indexOf(id),1);G.inv.push(COMBO[k]);G.sel=null;SFX.good();say('combined');drawInv();return}}
  SFX.click();G.sel=G.sel===id?null:id;if(G.sel)say(L(`${UI.no.selected}: ${ITEMS[id].no}. ${UI.no.tapUse}`,`${UI.en.selected}: ${ITEMS[id].en}. ${UI.en.tapUse}`));drawInv()};
 $('#gB').onclick=()=>{SFX.click();scrWorlds()};
 $('#gH').onclick=()=>{if(!G)return;SFX.click();const wait=Math.ceil((G.timer?Math.min(45,G.timer.max/3):45)-(Date.now()-G.t0)/1000);if(wait>0){say(L(`💡 Tenk selv litt til! Hint om ${wait} sekunder.`,`💡 Think for yourself a bit longer! Hint in ${wait} seconds.`));return}const h=hint();say(L('💡 '+h.no,'💡 '+h.en))};
 $('#gS').onclick=()=>{S.sound=!S.sound;save();$('#gS').textContent=S.sound?'🔊':'🔇';if(S.sound){ac();startAmb(G.th)}else stopAmb()}}
function scrWin(w){clearG();G=null;SFX.win();const cols=['#f1c40f','#e74c3c','#3498db','#2ecc71','#e84393'];
 const conf=Array.from({length:40},(_,i)=>`<span class="conf" style="left:${Math.random()*100}%;background:${cols[i%5]};animation-duration:${2+Math.random()*3}s;animation-delay:${-Math.random()*3}s"></span>`).join('');
 const all=S.best.every(b=>b>=100);
 render(`<div class="screen win">${conf}<div class="hb">${heroImg()}</div><h1>${tx('win')}</h1><p class="sub">${heroName()} ${tx('escaped')} ${tx(WORLDS[w].name).toLowerCase()}!</p>${all?`<p class="sub" style="font-weight:800;color:#f2c14e">🏆 ${S.lang==='no'?'Alle 400 dørene er åpnet! Du er en ekte dørmester!':'All 400 doors are open! You are a true door master!'}</p>`:''}
 <button class="big" id="wm">${tx('menu')}</button><button class="chip" id="wa">${tx('again')}</button></div>`);
 $('#wm').onclick=scrWorlds;$('#wa').onclick=()=>{S.cur[w]=1;save();fade(()=>startRoom(w,1))}}

/* ============ START ============ */
load();document.documentElement.lang=S.lang==='no'?'no':'en';scrStart();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
