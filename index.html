 const upd=()=>{$('#pd').textContent=(v+'_'.repeat(len)).slice(0,len)};upd();
 const submit=()=>{if(ov.hidden)return;if(check(v)){SFX.good();ov.hidden=true;ok()}else{SFX.wrong();const p=$('#padbox');p.classList.remove('bad');void p.offsetWidth;p.classList.add('bad');say('wrongCode');v='';upd()}};
 ov.onclick=e=>{if(e.target===ov){ov.hidden=true;return}const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;if(k==='X'){ov.hidden=true;return}if(k==='C'){v='';SFX.click();upd();return}if(k==='⏎'){if(v.length===len)submit();else SFX.wrong();return}if(v.length<len){v+=k;SFX.beep();upd();if(v.length===len)setTimeout(submit,220)}}}
function memoryGame(icons,done){const ov=$('#ov');const cards=shuffle([...icons,...icons]).map(ic=>({ic,up:0,ok:0}));let open=[],lock=false;
 const icoSVG=ic=>`<svg viewBox="-13 -13 26 26">${CAT[ic].d(0,0)}</svg>`;
 const rend=()=>{ov.innerHTML=`<div class="mem"><b>${tx('memTitle')}</b><div class="cards">${cards.map((c,i)=>`<button class="card ${c.ok?'ok':c.up?'up':''}" data-c="${i}">${c.up||c.ok?icoSVG(c.ic):'?'}</button>`).join('')}</div><button class="x" data-c="X">${tx('close')}</button></div>`};rend();ov.hidden=false;
 ov.onclick=e=>{if(e.target===ov){ov.hidden=true;return}const b=e.target.closest('[data-c]');if(!b||lock)return;if(b.dataset.c==='X'){ov.hidden=true;return}const c=cards[+b.dataset.c];if(c.up||c.ok)return;c.up=1;SFX.flip();open.push(c);rend();
  if(open.length===2){const[a,b2]=open;open=[];if(a.ic===b2.ic){a.ok=b2.ok=1;tone(900,.12,'triangle',.2);rend();if(cards.every(q=>q.ok))setTimeout(()=>{ov.hidden=true;done()},400)}else{lock=true;setTimeout(()=>{a.up=b2.up=0;lock=false;rend()},750)}}}}
function peekTick(){if(!G||G.peek||G.open||G.busy||!S.scary||!$('#ov').hidden)return;if(rnd()<G.th.peekRate){G.peek=pickr(G.th.peek);SFX.whisper();drawScene();later(()=>{G.peek=null;drawScene()},2200)}}
function timerTick(){const c=G&&G.timer;if(!c||G.open||G.busy)return;c.t+=.25;const left=Math.max(0,Math.ceil(c.max-c.t));const p=c.t/c.max;const b=$('#tbar');if(b)b.style.width=((1-p)*100)+'%';const n=$('#tnum');if(n)n.textContent=left+tx('timeLeft');const tm=$('#tmr');if(tm)tm.classList.toggle('low',left<=10);
 c.hb-=.25;if(c.hb<=0){SFX.heart();c.hb=Math.max(.35,1.6-p*1.3)}if(Math.round(c.t*4)%4===0)drawScene();if(c.t>=c.max)eaten()}
function clearG(){if(G)G.timers.forEach(t=>{clearTimeout(t);clearInterval(t)});stopAmb()}
function startRoom(w,n,retry){clearG();const th=WORLDS[w];const room=makeRoom(w,n);
 G={w,n,th,room,inv:[],sel:null,open:false,anim:false,peek:null,busy:false,fx:200,fy:380,timers:[],timer:room.timed?{t:0,max:room.timed,hb:1.5}:null};
 S.cur[w]=n;save();scrGame();drawScene();drawInv();startAmb(th);
 G.timers.push(setInterval(peekTick,1000));if(G.timer)G.timers.push(setInterval(timerTick,250));
 if(!retry)say(n===1?th.intro(heroName()):G.timer?'hurry':n===100?L('DØR 100! Den siste døren...','DOOR 100! The very last door...'):pickr([L(`Dør ${n}. Hvordan kommer jeg meg ut herfra?`,`Door ${n}. How do I get out of here?`),L(`Dør ${n}. Hmm... hva skjuler seg her?`,`Door ${n}. Hmm... what is hidden here?`),L(`Dør ${n}. Tenk logisk!`,`Door ${n}. Think logically!`)]))}
function walk(){const g=G;g.busy=true;SFX.step();const s=$('#scene');s.classList.remove('arrive');s.classList.add('walk');setTimeout(()=>{if(G!==g)return;const f=$('#fade');f.classList.add('on');setTimeout(()=>{if(G!==g)return;if(g.n<100){startRoom(g.w,g.n+1);$('#scene').classList.add('arrive')}else scrWin(g.w);f.classList.remove('on')},380)},650)}
function fade(fn){const f=$('#fade');f.classList.add('on');setTimeout(()=>{fn();f.classList.remove('on')},430)}
function svgPt(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:200,y:300}}
let lastShake=0;
window.addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a||!G||!G.room.onShake||G.busy)return;const m=Math.abs(a.x||0)+Math.abs(a.y||0)+Math.abs(a.z||0);if(m>32&&Date.now()-lastShake>500){lastShake=Date.now();G.room.onShake();drawScene()}});

/* ============ SKJERMER ============ */
const render=h=>{$('#app').innerHTML=h};
function logoSVG(){return `<svg viewBox="0 0 110 140"><rect x="5" y="5" width="100" height="135" rx="4" fill="#3a2212"/><rect x="15" y="15" width="80" height="125" fill="#fff3c4"/><rect x="15" y="15" width="80" height="125" fill="url(#lg)"/><defs><radialGradient id="lg"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f2c14e"/></radialGradient></defs><path d="M15 15 L55 25 L55 135 L15 140Z" fill="#7a4f26"/><circle cx="48" cy="80" r="3" fill="#f2c14e"/><ellipse cx="78" cy="70" rx="4" ry="3" fill="#c0392b"/><ellipse cx="90" cy="70" rx="4" ry="3" fill="#c0392b"/></svg>`}
function scrStart(){clearG();G=null;
 render(`<div class="screen menu"><div class="logo">${logoSVG()}</div><h1>${tx('title')}</h1><p class="sub">${tx('sub')}</p>
 <div class="row"><button class="chip ${S.lang==='no'?'on':''}" data-lang="no">Norsk</button><button class="chip ${S.lang==='en'?'on':''}" data-lang="en">English</button></div>
 <button class="big" id="play">${tx('play')}</button>
 <div class="row"><button class="chip" id="tSc">👻 ${tx('scary')}: ${tx(S.scary?'on':'off')}</button><button class="chip" id="tSd">${S.sound?'🔊':'🔇'} ${tx('sound')}: ${tx(S.sound?'on':'off')}</button></div>
 <p class="small">${tx('offline')}</p><button class="link" id="rst">${tx('reset')}</button></div>`);
 document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;document.documentElement.lang=S.lang==='no'?'no':'en';save();SFX.click();scrStart()});
 $('#play').onclick=()=>{ac();SFX.good();scrHero()};
 $('#tSc').onclick=()=>{S.scary=!S.scary;save();SFX.click();scrStart()};
 $('#tSd').onclick=()=>{S.sound=!S.sound;save();ac();SFX.click();scrStart()};
 $('#rst').onclick=()=>{if(confirm(tx('resetQ'))){S.cur=[1,1,1,1];S.best=[0,0,0,0];save();scrStart()}}}
function scrHero(){render(`<div class="screen menu"><h2>${tx('choose')}</h2><div class="heroes">${Object.keys(HEROES).map(h=>`<button class="hero ${S.hero===h?'on':''}" data-h="${h}">${heroSVG(h)}<b>${HEROES[h].name}</b></button>`).join('')}</div><button class="chip" id="hb">‹ ${tx('back')}</button></div>`);
 document.querySelectorAll('.hero').forEach(b=>b.onclick=()=>{S.hero=b.dataset.h;save();SFX.pick();scrWorlds()});$('#hb').onclick=scrStart}
function preview(th,n){const d=th.d;return `<svg class="prev" viewBox="0 30 400 570" preserveAspectRatio="xMidYMid slice">${room(th,n)}${R_(144,224,112,236,d.f)}${panel(150,d)}${panel(200,d)}${R_(178,203,44,18,d.f,'rx="3" stroke="#d4af37"')}${T(200,216,n,12,'#f5e6b8','font-weight="bold"')}</svg>`}
function scrWorlds(){clearG();G=null;
 render(`<div class="screen menu" style="justify-content:flex-start"><div class="wtop"><button class="back" id="wb">‹</button><h2>${tx('worlds')}</h2><span style="width:44px">${heroSVG(S.hero).replace('<svg','<svg width="44" height="44"')}</span></div>
 <div class="worlds">${WORLDS.map((w,i)=>{const b=S.best[i];return `<div class="wc"><div data-go="${i}">${preview(w,S.cur[i])}</div><h3>${tx(w.name)}</h3><div class="pr">${b>=100?'🏆 '+tx('done'):tx('door')+' '+S.cur[i]+' / 100'}</div><div class="pbar"><i style="width:${b}%"></i></div><div class="row"><button class="go" data-go="${i}">${tx('cont')} ▶</button><button data-pick="${i}" title="${tx('pickDoor')}">#</button></div></div>`}).join('')}</div>
 <p class="small">${S.lang==='no'?'Du kan velge hvilken bane du vil. Spillet husker hvor du var i hver bane.':'Pick any world you like. The game remembers where you were in each one.'}</p></div>`);
 $('#wb').onclick=scrHero;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const w=+b.dataset.go;ac();SFX.step();fade(()=>startRoom(w,S.cur[w]))});
 document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>scrPick(+b.dataset.pick))}
function scrPick(w){const mx=Math.max(S.best[w]+1,S.cur[w]);
 render(`<div class="screen menu" style="justify-content:flex-start"><div class="wtop"><button class="back" id="pb">‹</button><h2>${tx(WORLDS[w].name)}</h2><span style="width:44px"></span></div><p class="small">${tx('pickDoor')}</p>
 <div class="grid">${Array.from({length:100},(_,i)=>{const n=i+1;return `<button data-n="${n}" class="${n<=S.best[w]?'done':''} ${n===S.cur[w]?'cur':''}" ${n<=Math.min(100,mx)?'':'disabled'}>${n}</button>`}).join('')}</div></div>`);
 $('#pb').onclick=scrWorlds;document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ac();SFX.step();fade(()=>startRoom(w,+b.dataset.n))})}
function scrGame(){render(`<div class="screen game"><div class="top"><button id="gB">‹</button><div class="ttl">${tx(G.th.name)}<small>${tx('door')} ${G.n} / 100</small></div><button id="gH">💡</button><button id="gS">${S.sound?'🔊':'🔇'}</button></div>
 <div class="stage" id="stage"><svg id="scene" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet"></svg><div id="hand"></div>${G.timer?`<div id="tmr"><span>👹</span><div class="bar"><i id="tbar"></i></div><span id="tnum">${G.timer.max}${tx('timeLeft')}</span></div>`:''}</div>
 <div class="msg" id="msg"></div><div class="inv" id="inv"></div><div class="ov" id="ov" hidden></div></div>`);
 const svg=$('#scene');
 svg.addEventListener('click',e=>{const h=e.target.closest('[data-h]');if(h)onHot(h.dataset.h)});
 const mv=e=>{if(!G)return;const p=svgPt(svg,e);G.fx=p.x;G.fy=p.y;const g=svg.querySelector('#fl');if(g){g.setAttribute('cx',p.x);g.setAttribute('cy',p.y)}};
 svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);
 $('#inv').onclick=e=>{const b=e.target.closest('.slot');if(!b||!G||G.busy)return;const id=G.inv[+b.dataset.i];if(!id)return;
  if(G.sel&&G.sel!==id){const k=[G.sel,id].sort().join('+');if(COMBO[k]){const a=G.sel;G.inv.splice(G.inv.indexOf(a),1);G.inv.splice(G.inv.indexOf(id),1);G.inv.push(COMBO[k]);G.sel=null;SFX.good();say('combined');drawInv();return}}
  SFX.click();G.sel=G.sel===id?null:id;if(G.sel)say(L(`${UI.no.selected}: ${ITEMS[id].no}. ${UI.no.tapUse}`,`${UI.en.selected}: ${ITEMS[id].en}. ${UI.en.tapUse}`));drawInv()};
 $('#gB').onclick=()=>{SFX.click();scrWorlds()};
 $('#gH').onclick=()=>{if(!G)return;SFX.click();const h=hint();say(L('💡 '+h.no,'💡 '+h.en))};
 $('#gS').onclick=()=>{S.sound=!S.sound;save();$('#gS').textContent=S.sound?'🔊':'🔇';if(S.sound){ac();startAmb(G.th)}else stopAmb()}}
function scrWin(w){clearG();G=null;SFX.win();const cols=['#f1c40f','#e74c3c','#3498db','#2ecc71','#e84393'];
 const conf=Array.from({length:40},(_,i)=>`<span class="conf" style="left:${Math.random()*100}%;background:${cols[i%5]};animation-duration:${2+Math.random()*3}s;animation-delay:${-Math.random()*3}s"></span>`).join('');
 const all=S.best.every(b=>b>=100);
 render(`<div class="screen win">${conf}<div class="hb">${heroSVG(S.hero)}</div><h1>${tx('win')}</h1><p class="sub">${heroName()} ${tx('escaped')} ${tx(WORLDS[w].name).toLowerCase()}!</p>${all?`<p class="sub" style="font-weight:800;color:#f2c14e">🏆 ${S.lang==='no'?'Alle 400 dørene er åpnet! Du er en ekte dørmester!':'All 400 doors are open! You are a true door master!'}</p>`:''}
 <button class="big" id="wm">${tx('menu')}</button><button class="chip" id="wa">${tx('again')}</button></div>`);
 $('#wm').onclick=scrWorlds;$('#wa').onclick=()=>{S.cur[w]=1;save();fade(()=>startRoom(w,1))}}

/* ============ START ============ */
load();document.documentElement.lang=S.lang==='no'?'no':'en';scrStart();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
